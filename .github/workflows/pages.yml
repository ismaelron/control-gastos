name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar archivos del sitio
        run: |
          mkdir -p _site
          cp index.html styles.css core.js ui.js app.js cloud.js firebase-config.js \
             sw.js manifest.webmanifest .nojekyll _site/
          cp -r icons _site/
          # Versión en las direcciones de los archivos para evitar que el
          # navegador siga usando una copia antigua tras cada actualización.
          VERSION="${GITHUB_SHA::8}"
          sed -i "s/?v=dev/?v=${VERSION}/g" _site/index.html
          sed -i "s/var APP_VERSION = 'dev';/var APP_VERSION = '${VERSION}';/" _site/app.js
          sed -i "s/var VERSION = 'dev';/var VERSION = '${VERSION}';/" _site/sw.js
          grep -q "?v=${VERSION}" _site/index.html
          grep -q "APP_VERSION = '${VERSION}'" _site/app.js
          grep -q "VERSION = '${VERSION}'" _site/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
